"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$directory\
$git_branch\
$git_status\
$git_state\
$fill\
$kubernetes\
$golang\
$python\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character"""

[os]
disabled = false

[os.symbols]
Macos = ' '

[fill]
symbol = ' '

[kubernetes]
disabled = false
format = '[$symbol$context]($style) '

[[kubernetes.contexts]]
context_pattern = 'arn:[^:]+:eks:[^:]+:[^:]+:cluster/(?P<cluster>[^/]+)'
context_alias = '$cluster'

[golang]
format = '[$symbol($version )]($style)'

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
